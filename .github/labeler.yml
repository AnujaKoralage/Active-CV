# PR labeling configuration
documentation:
  - '*.md'
  - 'markdown/**/*'
  - 'carfax_business/**/*'

frontend:
  - 'src/**/*'

infrastructure:
  - '.github/**/*'
  - 'angular.json'
  - 'package.json'
  - 'package-lock.json'
  - 'tsconfig.json'
  - 'tsconfig.app.json'
  - 'tsconfig.spec.json'
  - 'tslint.json'
  - '.editorconfig'
  - '.gitignore'
  - 'browserslist'
  - 'karma.conf.js'
